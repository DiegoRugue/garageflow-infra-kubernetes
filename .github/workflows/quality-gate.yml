name: Quality Gate

on:
  workflow_call:
    outputs:
      source_commit:
        description: Exact platform source commit validated by this quality gate
        value: ${{ jobs.quality-gate.outputs.source_commit }}
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_commit: ${{ steps.revision.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: DiegoRugue/garageflow-infra-kubernetes
          ref: ${{ github.repository == 'DiegoRugue/garageflow-infra-kubernetes' && github.sha || github.ref_name }}

      - name: Record checked revision
        id: revision
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --require-hashes --requirement requirements-test.txt

      - name: Validate metadata contract tooling and coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/garageflow-platform-contract.coverage
        run: |
          python -m coverage run --branch --source=scripts --omit="scripts/tests/*" -m unittest discover -s scripts/tests -v
          python -m coverage report --fail-under=80

      - name: Validate repository ownership policies
        run: python -m unittest discover -s tests -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Validate Terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap/state-backend init -backend=false -input=false
          terraform -chdir=infra/bootstrap/state-backend validate
          terraform -chdir=infra/platform init -backend=false -input=false
          terraform -chdir=infra/platform validate
          terraform -chdir=infra/platform test
          for root in ingress edge; do
            terraform -chdir="infra/${root}" init -backend=false -input=false
            terraform -chdir="infra/${root}" validate
            terraform -chdir="infra/${root}" test
          done

      - name: Validate deployment script syntax
        run: bash -n scripts/deploy-platform.sh scripts/lib/deploy-platform-functions.sh scripts/deploy-ingress.sh scripts/deploy-edge.sh scripts/deploy-edge-component.sh
